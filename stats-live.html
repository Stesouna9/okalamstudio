<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<style>
 :root{--bg:#0A0C0F;--panel:#15181E;--edge:#000;--txt:#F5F1E8;--dim:rgba(245,241,232,.4);--gold:#D4A017;--up:#4ADE80}
 *{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none}
 body{background:var(--bg);color:var(--txt);font:13px/1.3 -apple-system,"SF Pro Text",system-ui;padding:12px;overflow:hidden;}
 .hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;padding:0 2px}
 .hd b{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);font-weight:700}
 .tot{font-size:11px;color:var(--gold);font-weight:700;font-variant-numeric:tabular-nums}
 .r{display:flex;align-items:center;gap:9px;margin-bottom:6px}
 .ic{width:20px;height:20px;flex:0 0 20px;fill:var(--c)}
 .lb{flex:1;min-width:0}
 .lb .n{font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .lb .s{font-size:9.5px;color:var(--dim);font-variant-numeric:tabular-nums;margin-top:1px}
 /* volets facon aeroport */
 .flap{display:flex;gap:2px}
 .d{position:relative;width:17px;height:26px;perspective:70px;background:var(--panel);border-radius:3px;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.06),0 1px 2px rgba(0,0,0,.5);overflow:hidden}
 .d::after{content:"";position:absolute;top:50%;left:0;right:0;height:1px;background:var(--edge);opacity:.85;z-index:5}
 .d span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
   font:700 17px/1 "SF Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums;color:var(--txt)}
 .d span.old{animation:out .34s cubic-bezier(.4,0,.6,1) forwards;transform-origin:center bottom;z-index:3}
 .d span.new{animation:in .34s cubic-bezier(.4,0,.6,1) forwards;transform-origin:center top;z-index:2}
 @keyframes out{0%{transform:rotateX(0)}100%{transform:rotateX(-90deg);opacity:.15}}
 @keyframes in{0%{transform:rotateX(90deg);opacity:.15}100%{transform:rotateX(0);opacity:1}}
 .sep{width:5px}
 .dl{font-size:9px;color:var(--up);width:26px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
 .ft{display:flex;justify-content:space-between;align-items:center;margin-top:9px;font-size:9px;color:var(--dim);padding:0 2px}
 .dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--up);margin-right:4px;animation:p 2s infinite}
 @keyframes p{0%,100%{opacity:1}50%{opacity:.2}}
 .lv{color:var(--up);font-size:8px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
</style></head><body>
<div class="hd"><b>Elisa · audience</b><span class="tot" id="tot">·····</span></div>
<div id="rows"></div>
<div class="ft"><span><span class="dot"></span><span id="tm">demarrage</span></span><span id="src"></span></div>
<script>
const I={yt:'<path d="M23 12s0-3.9-.5-5.8a3 3 0 0 0-2.1-2.1C18.5 3.5 12 3.5 12 3.5s-6.5 0-8.4.6A3 3 0 0 0 1.5 6.2C1 8.1 1 12 1 12s0 3.9.5 5.8a3 3 0 0 0 2.1 2.1c1.9.6 8.4.6 8.4.6s6.5 0 8.4-.6a3 3 0 0 0 2.1-2.1C23 15.9 23 12 23 12zM9.8 15.6V8.4l6.2 3.6-6.2 3.6z"/>',
ig:'<path d="M12 2.2c3.2 0 3.6 0 4.9.07 1.2.05 1.8.25 2.2.42.6.2 1 .5 1.4 1 .5.4.8.8 1 1.4.2.4.4 1 .4 2.2.1 1.3.1 1.7.1 4.9s0 3.6-.1 4.9c0 1.2-.2 1.8-.4 2.2-.2.6-.5 1-1 1.4-.4.5-.8.8-1.4 1-.4.2-1 .4-2.2.4-1.3.1-1.7.1-4.9.1s-3.6 0-4.9-.1c-1.2 0-1.8-.2-2.2-.4-.6-.2-1-.5-1.4-1-.5-.4-.8-.8-1-1.4-.2-.4-.4-1-.4-2.2-.1-1.3-.1-1.7-.1-4.9s0-3.6.1-4.9c0-1.2.2-1.8.4-2.2.2-.6.5-1 1-1.4.4-.5.8-.8 1.4-1 .4-.2 1-.4 2.2-.4C8.4 2.2 8.8 2.2 12 2.2zm0 3.2a6.6 6.6 0 1 0 0 13.2 6.6 6.6 0 0 0 0-13.2zm0 10.9a4.3 4.3 0 1 1 0-8.6 4.3 4.3 0 0 1 0 8.6zm8.4-11.2a1.55 1.55 0 1 1-3.1 0 1.55 1.55 0 0 1 3.1 0z"/>',
fb:'<path d="M22 12a10 10 0 1 0-11.6 9.9v-7H7.9V12h2.5V9.8c0-2.5 1.5-3.9 3.8-3.9 1.1 0 2.2.2 2.2.2v2.5h-1.3c-1.2 0-1.6.8-1.6 1.6V12h2.8l-.4 2.9h-2.3v7A10 10 0 0 0 22 12z"/>',
tt:'<path d="M16.6 5.8a4.8 4.8 0 0 1-1-3.1h-3.4v13.6a2.9 2.9 0 1 1-2-2.8V10a6.3 6.3 0 1 0 5.4 6.2V9.1a8.2 8.2 0 0 0 4.8 1.5V7.2a4.8 4.8 0 0 1-3.8-1.4z"/>'};
const CH=[{k:'yt1',n:'YouTube',c:'#FF0033',i:'yt',live:1},
{k:'yt2',n:'YouTube 2',c:'#FF0033',i:'yt',live:1},
{k:'ig',n:'Instagram',c:'#E1306C',i:'ig'},
{k:'fb',n:'Facebook',c:'#1877F2',i:'fb'},
{k:'tt',n:'TikTok',c:'#25F4EE',i:'tt',live:1}];
const S={};
document.getElementById('rows').innerHTML=CH.map(c=>`<div class="r" style="--c:${c.c}">
<svg class="ic" viewBox="0 0 24 24">${I[c.i]}</svg>
<div class="lb"><div class="n">${c.n}${c.live?' <span class="lv">live</span>':''}</div><div class="s" id="s-${c.k}">…</div></div>
<div class="flap" id="f-${c.k}"></div><div class="dl" id="d-${c.k}"></div></div>`).join('');

function digits(n){ return n==null?'·····'.split(''):n.toLocaleString('fr-FR').split(''); }
function render(k,val){
  const box=document.getElementById('f-'+k), chars=digits(val), prev=S[k]?.chars||[];
  if(box.children.length!==chars.length){
    box.innerHTML=chars.map(c=>(/[\s\u202f\u00a0]/.test(c))?'<div class="sep"></div>':`<div class="d"><span>${c}</span></div>`).join('');
  }else{
    let idx=0;
    chars.forEach((c,i)=>{
      if(/[\s\u202f\u00a0]/.test(c))return;
      const cell=box.children[i]; if(!cell||!cell.classList.contains('d'))return;
      const cur=cell.querySelector('span:not(.old)');
      if(cur && cur.textContent!==c){
        cur.classList.add('old');
        const nw=document.createElement('span'); nw.className='new'; nw.textContent=c;
        cell.appendChild(nw);
        setTimeout(()=>{ cell.querySelectorAll('.old').forEach(o=>o.remove()); nw.classList.remove('new'); },360);
      }
    });
  }
  S[k]={...S[k],chars,val};
}
function set(k,val,sub){
  const prev=S[k]?.val;
  render(k,val);
  if(sub)document.getElementById('s-'+k).textContent=sub;
  if(prev!=null&&val!=null&&val!==prev){
    const d=val-prev,e=document.getElementById('d-'+k);
    e.textContent=(d>0?'+':'')+d; e.style.color=d>0?'var(--up)':'#F87171';
    setTimeout(()=>{e.textContent='';},9000);
  }
  const v=CH.map(c=>S[c.k]?.val).filter(x=>typeof x==='number');
  if(v.length)document.getElementById('tot').textContent=v.reduce((a,b)=>a+b,0).toLocaleString('fr-FR');
}
// appele depuis Swift
window.push=function(data){
  if(data.yt1)set('yt1',data.yt1.subs,`${(data.yt1.views||0).toLocaleString('fr-FR')} vues · ${data.yt1.videos} videos`);
  if(data.yt2)set('yt2',data.yt2.subs,`${(data.yt2.views||0).toLocaleString('fr-FR')} vues · ${data.yt2.videos} videos`);
  if(data.tt) set('tt', data.tt.subs, `${(data.tt.likes||0).toLocaleString('fr-FR')} j'aime · ${data.tt.videos} videos`);
  if(data.ig) set('ig', data.ig.subs, `${(data.ig.posts||0).toLocaleString('fr-FR')} publications`);
  if(data.fb) set('fb', data.fb.subs, data.fb.note||'page');
  document.getElementById('tm').textContent=new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
};
CH.forEach(c=>render(c.k,null));

const YT1='UChxg0VY4KoLmvsMqvuE4Xfw', YT2='UCcRG-Be3ewPk8GJUzSgiZlw';
const STATS='https://raw.githubusercontent.com/Stesouna9/okalamstudio/main/data/stats.json';
async function yt(id,key){
  try{
    const r=await fetch('https://mixerno.space/api/youtube-channel-counter/user/'+id,{cache:'no-store'});
    const j=await r.json(), g=v=>j.counts.find(c=>c.value===v)?.count;
    if(!g('subscribers'))throw 0;
    return {[key]:{subs:g('subscribers'),views:g('views'),videos:g('videos')}};
  }catch(e){
    try{
      const r=await fetch('https://api.socialcounts.org/youtube-live-subscriber-count/'+id,{cache:'no-store'});
      const c=(await r.json()).counters.estimation;
      return {[key]:{subs:c.subscriberCount,views:c.viewCount,videos:c.videoCount}};
    }catch(e2){return {};}
  }
}
async function loop(){
  try{
    const [a,b]=await Promise.all([yt(YT1,'yt1'),yt(YT2,'yt2')]);
    window.push(Object.assign({},a,b));
  }catch(e){}
}
async function slow(){
  try{
    const j=await (await fetch(STATS+'?t='+Date.now(),{cache:'no-store'})).json(), e=j.elisa||{}, o={};
    if(e.instagram)o.ig={subs:e.instagram.followers,posts:e.instagram.posts};
    if(e.tiktok)o.tt={subs:e.tiktok.followers,likes:e.tiktok.likes,videos:e.tiktok.videos};
    if(e.facebook)o.fb={subs:e.facebook.followers,note:'page'};
    const fb=localStorage.getItem('okalam.fb');
    if(fb&&!o.fb)o.fb={subs:parseInt(fb,10),note:'saisie manuelle'};
    window.push(o);
  }catch(e){}
}
try{
  const rowFb=document.querySelectorAll('.r')[3];
  if(rowFb){ rowFb.style.cursor='pointer'; rowFb.title='Cliquer pour saisir';
    rowFb.onclick=function(){
      const v=prompt("Nombre d'abonnes Facebook :", localStorage.getItem('okalam.fb')||'');
      if(v&&!isNaN(parseInt(v,10))){localStorage.setItem('okalam.fb',parseInt(v,10));slow();}
    };
  }
}catch(e){}
loop(); slow();
setInterval(loop,45000); setInterval(slow,900000);


</script></body></html>
